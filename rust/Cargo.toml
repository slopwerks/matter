[package]
name = "rust_lib_matter"
version = "0.1.6"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
matrix-sdk = { version = "0.18", default-features = false, features = [
  "e2e-encryption",
  "bundled-sqlite",
] }
matrix-sdk-base = { version = "0.18", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-ui = { version = "0.18", default-features = false }
ruma = { version = "0.16", features = [
  "client-api-c",
  "html-matrix",
  "unstable-msc2545",
  "unstable-msc3381",
] }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "net",
  "io-util",
  "time",
] }
anyhow = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
log = "0.4"
dirs = "6"
futures-util = "0.3"
mime = "0.3"

[profile.release]
opt-level = "z"
lto = true
# A global `strip = "symbols"` config breaks macOS release builds for any minimum target of 12.0 and above when building on a macOS 27 host (https://github.com/rust-lang/rust/issues/157750, fixed by upstream but not merged in any stable tag as of rust-lang/rust 1.97.1). The issue is specific to build-time artifacts that do not enter the final build, so it doesn't have an effect on the final product (rust_lib_matter) as long as it is manually stripped in the platform-specific build scripts.
strip = "none"
codegen-units = 1
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
