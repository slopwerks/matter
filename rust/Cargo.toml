[package]
name = "rust_lib_matter"
version = "0.1.8"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
matrix-sdk = { version = "0.18", default-features = false, features = [
  "e2e-encryption",
  "bundled-sqlite",
  "experimental-search",
] }
matrix-sdk-base = { version = "0.18", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-ui = { version = "0.18", default-features = false }
# Pin the exact version that is patched from the vendor directory. Without this,
# cargo could resolve a newer registry release (e.g. 0.18.1) for matrix-sdk's
# `^0.18.0` requirement and silently ignore the `[patch.crates-io]` override.
# Keep this in sync when upgrading the SDK.
matrix-sdk-search = "=0.18.0"
ruma = { version = "0.16", features = [
  "client-api-c",
  "html-matrix",
  "unstable-msc2545",
  "unstable-msc3381",
] }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "net",
  "io-util",
  "time",
] }
anyhow = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
once_cell = "1"
log = "0.4"
dirs = "6"
futures-util = "0.3"
mime = "0.3"

[dev-dependencies]
tantivy = "0.26.1"
matrix-sdk = { version = "0.18", default-features = false, features = ["testing"] }
matrix-sdk-test = "0.18"

[patch.crates-io]
matrix-sdk-search = { path = "vendor/matrix-sdk-search" }

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
